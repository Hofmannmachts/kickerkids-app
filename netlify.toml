[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
X-Robots-Tag = "noindex, nofollow"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://qddlivsvcdstenpcajhm.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
